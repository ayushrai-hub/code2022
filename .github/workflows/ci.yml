name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  python-lint:
    name: Python Linting & Formatting
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project:
          - GenAI/genAI
          - OutLier-AI
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black ruff pylint
          if [ -f "${{ matrix.project }}/requirements.txt" ]; then
            pip install -r "${{ matrix.project }}/requirements.txt"
          fi
      
      - name: Check code formatting with Black
        run: |
          black --check --diff "${{ matrix.project }}" || true
      
      - name: Run Ruff linter
        run: |
          ruff check "${{ matrix.project }}" || true
      
      - name: Run Pylint
        run: |
          pylint "${{ matrix.project }}" --rcfile=.pylintrc || true
        continue-on-error: true

  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project:
          - GenAI/genAI
          - OutLier-AI
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f "${{ matrix.project }}/requirements.txt" ]; then
            pip install -r "${{ matrix.project }}/requirements.txt"
          fi
          pip install pytest pytest-cov
      
      - name: Run tests
        run: |
          if [ -d "${{ matrix.project }}/tests" ]; then
            pytest "${{ matrix.project }}/tests" -v --cov="${{ matrix.project }}" --cov-report=xml || true
          else
            echo "No tests directory found for ${{ matrix.project }}"
          fi
        continue-on-error: true
      
      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: ${{ matrix.project }}
        continue-on-error: true

  js-lint:
    name: JavaScript/TypeScript Linting & Formatting
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project:
          - portfolio/ayush.me
          - iha-by-himani/IHA-art-studio
          - MogoDb/MogoDb
          - new/mongodb-node-app
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.project }}/package*.json
      
      - name: Install dependencies
        run: |
          if [ -f "${{ matrix.project }}/package.json" ]; then
            cd "${{ matrix.project }}"
            npm ci || npm install
            cd ../..
          fi
        continue-on-error: true
      
      - name: Install Prettier and ESLint
        run: |
          npm install -g prettier eslint @typescript-eslint/parser @typescript-eslint/eslint-plugin || true
      
      - name: Check code formatting with Prettier
        run: |
          prettier --check "${{ matrix.project }}/**/*.{js,jsx,ts,tsx,json}" || true
        continue-on-error: true
      
      - name: Run ESLint
        run: |
          eslint "${{ matrix.project }}/**/*.{js,jsx,ts,tsx}" --ext .js,.jsx,.ts,.tsx || true
        continue-on-error: true

  js-tests:
    name: JavaScript/TypeScript Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project:
          - portfolio/ayush.me
          - iha-by-himani/IHA-art-studio
          - MogoDb/MogoDb
          - new/mongodb-node-app
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.project }}/package*.json
      
      - name: Install dependencies
        run: |
          if [ -f "${{ matrix.project }}/package.json" ]; then
            cd "${{ matrix.project }}"
            npm ci || npm install
            cd ../..
          fi
        continue-on-error: true
      
      - name: Run tests
        run: |
          if [ -f "${{ matrix.project }}/package.json" ]; then
            cd "${{ matrix.project }}"
            npm test || true
            cd ../..
          else
            echo "No package.json found for ${{ matrix.project }}"
          fi
        continue-on-error: true

  all-checks:
    name: All Checks Summary
    runs-on: ubuntu-latest
    needs: [python-lint, python-tests, js-lint, js-tests]
    if: always()
    
    steps:
      - name: Check job status
        run: |
          echo "Python linting: ${{ needs.python-lint.result }}"
          echo "Python tests: ${{ needs.python-tests.result }}"
          echo "JS/TS linting: ${{ needs.js-lint.result }}"
          echo "JS/TS tests: ${{ needs.js-tests.result }}"
          echo "All checks completed!"
